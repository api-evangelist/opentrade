aid: opentrade
name: Opentrade
description: >-
  OpenTrade is an institutional-grade platform for stablecoin lending and yield
  products, enabling fintechs, neobanks, crypto exchanges, custodians, stablecoin
  issuers, and treasury managers to offer white-labeled and embedded yield on
  USDC, USDT, and EURC without off-ramping. The platform pairs a cloud web
  application and REST/GraphQL APIs with an on-chain blockchain protocol (a fork
  of Circle Research's Perimeter, built on the ERC-20 and ERC-4626 standards and
  deployed on Ethereum, Avalanche, and Plume) that issues yield-bearing vault
  tokens backed by real-world assets such as money market funds, US Treasury
  bills, corporate bonds, CLOs, and trade finance. OpenTrade combines this
  technology with a legal and operational framework (bankruptcy-remote SPVs,
  master lending agreements, and FCA-regulated oversight) so partners can deliver
  safe, compliant, scalable yield to KYC'd institutions and businesses. OpenTrade
  is developed by Open Trade Technology Ltd and is backed by Y Combinator.
